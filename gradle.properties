org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# 노트북이 버거우면 아래 두 줄의 주석(#)을 지운다
#org.gradle.workers.max=2
#org.gradle.parallel=false

# Pleos SDK 연동 스위치
#   false : 시연 모드 + 표준 AAOS API(속도, 기어) + 안드로이드 위치만으로 빌드한다. 일반 Automotive 에뮬레이터에서도 실행된다.
#   true  : src/pleos 의 Pleos SDK 연동(브레이크·핸들·깜빡이, FusedLocation 위치·근접 알림, Pleos 음성)을 함께 빌드한다.
#           Pleos Connect Emulator 에서 쓴다.
usePleos=true

# 길을 놓친 곳 (Pleos NaviHelper). 빌드가 NaviHelper 때문에 실패하면 false 로 두면 그 기능만 빠진다
useNavi=true
